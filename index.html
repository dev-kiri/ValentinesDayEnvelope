<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falling Items</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="shortcut icon" href="assets/imgs/ico.webp" type="image/x-icon">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="envelope">
      <div class="letter">
        <!-- Burn marks -->
        <span class="burn burn-1"></span>
        <span class="burn burn-2"></span>
        <span class="burn burn-3"></span>
        <span class="burn burn-4"></span>
        <span class="burn burn-5"></span>

        <p>Hey, how are you?</p>
        <p>
          I don't know how to write very poetic letters, but... I do know that I
          feel comfortable around you, and... that actually says a lot already.
        </p>
        <p>
          <i>
            I like laughing with you, talking about everything and nothing, and
            knowing that you're there.
          </i>
        </p>
        <p>Happy Valentine's Day! &#x1F49E;</p>
      </div>

      <input type="checkbox" id="sealToggle" class="seal-toggle" />
      <label for="sealToggle" class="seal"></label>
    </div>
    <i class="author">— @Kiri —</i>
    <script src="js/script.js"></script>
  </body>
</html>
